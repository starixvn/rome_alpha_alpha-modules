<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:LocalResources.UIForecastLang.lblScoreMap}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="Resources/ScoreMap.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="page_main" style="min-height:380px">
        <!--mainTitle-->
        <div id="header_main">
            {Forecast}
        </div>
        <!--/mainTitle-->
        <div id="sContent">
            <!--Content-->
            <!--LimitLeagueList-->
            <div id="box_header" style="width: {mWidth}">
                <table border="0" cellpadding="0" cellspacing="1" style="display:inline-block;margin:5px;{display}">
                    <tr>
                        <td>
                            {static:LocalResources.UIForecastLang.league}
                        </td>
                        <td id="selLeague">
                            {LeagueList}
                        </td>
                        <td><div title="{static:LocalResources.UIForecastLang.RefreshLeagues}" class="btnRefresh" id="RefreshLeagues">&nbsp;</div></td>
                        <td><input type="button" class="btn" id="dSelMatch" value="{static:LocalResources.UIForecastLang.SelectMatch}" style="width:80px"></td>
                        <td valign="top"><div style="float: left;padding-left:10px" class="" id="loading"></div></td>
                    </tr>
                </table>
                <div style="float:right;">
                    <a href="javascript:;" style="margin:10px 5px 0 0;height:16px;display:inline-block" class="infoIco"
                        title="Click to view Score Map Info" id="scoreMapIcon"></a>
                </div>
                <div id="tblLiveDead" style="{displayLiveDead}">
                    <table class="tblRpt" border="0" cellpadding="0" cellspacing="1" style="margin:5px">
                        <tr class="even_row">
                            <td>
                                <input class="hand" type="checkbox" {isCheckedAllLive} id="chkAllL">
                                <label class="hand bold" for="chkAllL" title="{static:LocalResources.UIForecastLang.lblLiveBall}">{lblLiveBall}</label>
                            </td>
                            <td id="Td1">
                                <table class="reference"><tr>{LiveBall}</tr></table>
                            </td>
                        </tr>
                        <tr class="even_row">
                            <td>
                                <input class="hand" type="checkbox" {isCheckedAllDead} id="chkAllD">
                                <label class="hand bold" for="chkAllD" title="{static:LocalResources.UIForecastLang.lblDeadball}">{lblDeadball}</label>
                            </td>
                            <td id="Td2">
                                <table class="reference"><tr>{DeadBall}</tr></table>
                            </td>
                        </tr>
                    </table>       
                    <table border="0" cellpadding="0" cellspacing="1" style="margin:0px 5px 5px">
                        <tr>
                            <td><input type="button" value="{static:LocalResources.UIForecastLang.submit}" id="dSubmit" class="btn" style="width: 70px;"></td>
                            <td valign="top"><div style="height:23px;padding-left:15px" class="" id="loadingSubmit"></div></td>
                        </tr>
                    </table>             
                </div>
            </div>            
            <!--/LimitLeagueList-->
            <div id="mainContent" style="width: {mWidth}">
                <!--ScoreMap-->
                <div id="RefreshContent{matchId}" style="padding-top:6px">
                    {MainTable}
                </div>
                <!--/ScoreMap-->
            </div>
            <!--/Content-->
            {load:Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template ErrorMsg = new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        </div>
    </div>
    <input id="strValueL" name="strValueL" type="hidden" value="0"/>
    <input id="strValueD" name="strValueD" type="hidden" value="0"/>
    {BoxMatch}

    <script src="../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
    <script src="Resources/MatchByLeague.js" type="text/javascript"></script>
    <script src="Resources/ScoreMap.js" type="text/javascript"></script>
</body>
</html>
